preprocessing_registry_version: kong_style_v1
created_or_updated: 2026-05-06
scope: "executed v1: same-cycle dynamic forward fill plus train-fold typed imputation/encoding/scaling"
cohort_policy: "formal strict cohort only: IVF/ICSI + GnRH-a long protocol + treatment_count=1"
layer3_boundary: "embryo/transfer variables remain excluded by default"
forward_fill_policy:
  status: "executed_in_sample_build_pipeline"
  allowed_scope: "same cycle_uid only"
  sort_keys:
    - monitoring_order
    - monitoring_date
  rule: "forward fill dynamic variables within cycle_uid after chronological sorting; never backfill, never cross-cycle fill, never use next-visit or outcome columns"
  residual_missing_fallback: "numeric median imputer and categorical Unknown imputer fit on train fold only"
missingness_outputs:
  column_audit_csv: "data/profiles/kong_preprocessing_v1_missingness_audit.csv"
  registry_columns_csv: "data/profiles/kong_preprocessing_v1_registry_columns.csv"
